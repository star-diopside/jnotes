<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous" />
  <link href="../../static/css/layout.css" rel="stylesheet" />
  <title>ユーザ登録テンプレート</title>
</head>
<body>
  <div class="container">
    <h1 class="pb-2 mt-4 mb-2 border-bottom">ユーザ登録テンプレート</h1>
    <form method="post" role="form">
      <div class="alert alert-danger" role="alert">エラーメッセージ</div>
      <div th:fragment="content">
        <div class="row mb-3">
          <label for="username" class="col-form-label col-sm-2">ユーザ名</label>
          <div class="col-sm-10">
            <input th:field="*{username}" th:class="${#fields.hasErrors('username')}? 'form-control is-invalid' : 'form-control'" type="text" class="form-control is-invalid" id="username" />
            <div th:errors="*{username}" class="invalid-feedback">エラーメッセージ</div>
          </div>
        </div>
        <div class="row mb-3">
          <label for="password" class="col-form-label col-sm-2">パスワード</label>
          <div class="col-sm-10">
            <input th:field="*{password}" th:class="${#fields.hasErrors('password')}? 'form-control is-invalid' : 'form-control'" type="password" class="form-control is-invalid" id="password" />
            <div th:errors="*{password}" class="invalid-feedback">エラーメッセージ</div>
          </div>
        </div>
        <div class="row mb-3">
          <label for="confirmPassword" class="col-form-label col-sm-2">パスワード（確認）</label>
          <div class="col-sm-10">
            <input th:field="*{confirmPassword}" th:class="${#fields.hasErrors('confirmPassword')}? 'form-control is-invalid' : 'form-control'" type="password" class="form-control is-invalid" id="confirmPassword" />
            <div th:errors="*{confirmPassword}" class="invalid-feedback">エラーメッセージ</div>
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-form-label col-sm-2 pt-0">有効</div>
          <div class="col-sm-10">
            <div th:class="${#fields.hasErrors('enabled')}? 'form-check is-invalid' : 'form-check'" class="form-check is-invalid">
              <input th:field="*{enabled}" th:class="${#fields.hasErrors('enabled')}? 'form-check-input is-invalid' : 'form-check-input'" type="checkbox" class="form-check-input is-invalid" id="enabled" />
            </div>
            <div th:errors="*{enabled}" class="invalid-feedback">エラーメッセージ</div>
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-form-label col-sm-2 pt-0">ロール</div>
          <div class="col-sm-10">
            <div th:class="${#fields.hasErrors('roles')}? 'form-check form-check-inline is-invalid' : 'form-check form-check-inline'" class="form-check form-check-inline is-invalid">
              <input th:field="*{roles}" th:class="${#fields.hasErrors('roles')}? 'form-check-input is-invalid' : 'form-check-input'" type="checkbox" class="form-check-input is-invalid" id="roleAdmin" value="ADMIN" />
              <label class="form-check-label" for="roleAdmin">管理者</label>
            </div>
            <div th:class="${#fields.hasErrors('roles')}? 'form-check form-check-inline is-invalid' : 'form-check form-check-inline'" class="form-check form-check-inline is-invalid">
              <input th:field="*{roles}" th:class="${#fields.hasErrors('roles')}? 'form-check-input is-invalid' : 'form-check-input'" type="checkbox" class="form-check-input is-invalid" id="roleUser" value="USER" />
              <label class="form-check-label" for="roleUser">ユーザ</label>
            </div>
            <div th:errors="*{roles}" class="invalid-feedback">エラーメッセージ</div>
          </div>
        </div>
      </div>
      <div class="row mb-3">
        <div class="col-sm-12">
          <div class="float-end">
            <input type="submit" value="登録" class="btn btn-primary" />
          </div>
        </div>
      </div>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
</body>
</html>
