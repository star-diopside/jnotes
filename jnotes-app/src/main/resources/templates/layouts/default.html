<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous"/>
  <link href="../../static/css/layout.css" rel="stylesheet" th:href="@{/css/layout.css}"/>
  <title>Notes</title>
</head>
<body>
<nav class="navbar sticky-top bg-dark" data-bs-theme="dark">
  <div class="container">
    <a th:href="@{/}" class="navbar-brand">Notes</a>
    <form th:action="@{/logout}" th:method="post" class="d-flex">
      <span sec:authentication="name" class="navbar-text me-4">username</span>
      <button class="btn btn-sm btn-light" type="submit">ログアウト</button>
    </form>
  </div>
</nav>
<div class="container">
  <div layout:fragment="content"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
</body>
</html>
